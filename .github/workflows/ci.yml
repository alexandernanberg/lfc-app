name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo, and pull requests from forks run this too.
permissions:
  contents: read

jobs:
  check:
    name: Format, lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each check runs even if an earlier one failed, so a single run reports
      # everything that needs fixing instead of just the first failure.
      - name: Format
        if: '!cancelled()'
        run: pnpm format

      - name: Lint
        if: '!cancelled()'
        run: pnpm lint

      - name: Typecheck
        if: '!cancelled()'
        run: pnpm typecheck
